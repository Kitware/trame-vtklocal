name: Test and Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
          enable-cache: true
      - name: Install the project
        run: uv sync --all-extras --dev

      # Install and run pre-commit
      - run: |
          uv run pre-commit install
          uv run pre-commit install --hook-type commit-msg
          uv run pre-commit run --all-files

  pytest:
    name: Pytest ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    container:
      image: ${{ matrix.config.container }}
      options: ${{ matrix.config.container-options }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        config:
          - {
              name: "Linux",
              os: [self-hosted, gpu],
              container: "mcr.microsoft.com/playwright:v1.61.0-noble",
              # Default caps are compute,utility, which mount no rendering
              # driver at all. "all" pulls in graphics/display so
              # libEGL_nvidia and libGLX_nvidia reach the container.
              container-options: "--gpus all -e NVIDIA_DRIVER_CAPABILITIES=all -e NVIDIA_VISIBLE_DEVICES=all",
            }
          - { name: "MacOSX", os: [macos-latest], container: "", container-options: "" }
          - { name: "Windows", os: [windows-latest], container: "", container-options: "" }

    defaults:
      run:
        shell: bash

    # Pin uv to the matrix interpreter; without this uv picks its own default
    # and the vtk dev wheel is only published for the interpreters listed above.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      # The Playwright image already ships libvulkan1/libegl1/libgles2 (webkit
      # pulls them in), so no apt step is needed. The NVIDIA libraries those
      # loaders dispatch to are mounted by the container toolkit, not installed.
      - name: Enable GPU tests
        if: matrix.config.name == 'Linux'
        run: echo "TRAME_TEST_GPU=1" >> "$GITHUB_ENV"

      - name: Report GPU
        if: matrix.config.name == 'Linux'
        run: nvidia-smi

      # Write manifests when they are missing.
      # without the Vulkan one, ANGLE's vulkan backend finds no device and
      # WebGPU silently drops to SwiftShader (undesired)
      - name: Backfill GPU ICD manifests
        if: matrix.config.name == 'Linux'
        run: |
          if ! ls /usr/share/vulkan/icd.d/*nvidia*.json /etc/vulkan/icd.d/*nvidia*.json >/dev/null 2>&1; then
            if ldconfig -p | grep -q libGLX_nvidia; then
              api=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1)
              echo "no Vulkan ICD found; writing one for driver $api"
              mkdir -p /usr/share/vulkan/icd.d
              cat > /usr/share/vulkan/icd.d/nvidia_icd.json <<'JSON'
          {
              "file_format_version": "1.0.0",
              "ICD": {
                  "library_path": "libGLX_nvidia.so.0",
                  "api_version": "1.3.277"
              }
          }
          JSON
            else
              echo "libGLX_nvidia is not mounted -- the graphics capability is not reaching the container"
            fi
          fi
          if ! ls /usr/share/glvnd/egl_vendor.d/*nvidia*.json >/dev/null 2>&1; then
            if ldconfig -p | grep -q libEGL_nvidia; then
              echo "no EGL vendor manifest found; writing one"
              mkdir -p /usr/share/glvnd/egl_vendor.d
              cat > /usr/share/glvnd/egl_vendor.d/10_nvidia.json <<'JSON'
          {
              "file_format_version": "1.0.0",
              "ICD": {
                  "library_path": "libEGL_nvidia.so.0"
              }
          }
          JSON
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
          enable-cache: true

      # The Playwright image already ships node 24, which is what this action
      # would install. Keep the pin in sync with the image's NODE_VERSION.
      - name: Set Up Node
        if: matrix.config.name != 'Linux'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build Vue Components
        run: |
          cd vue-components
          npm i
          npm run build

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Install OSMesa for Windows
        if: matrix.config.name == 'Windows'
        # 25.0.7 is the last mesa-dist-win release that ships osmesa.dll
        # (removed in 25.1.0). PATH is searched by LoadLibrary, which is how
        # VTK's vtkOSOpenGLRenderWindow locates osmesa.dll at runtime.
        run: |
          curl -sSL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/25.0.7/mesa3d-25.0.7-release-msvc.7z
          7z x mesa.7z -omesa
          cygpath -w "$PWD/mesa/x64" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          uv run playwright install

      - name: Verify browser GPU
        if: matrix.config.name == 'Linux'
        run: uv run python tests/check_gpu.py

      - name: Run tests
        run: uv run pytest -s ./tests --cov=src --cov-report=xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3

      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trame-vtklocal-tests-${{  matrix.config.name }}
          path: |
            tests/results/**/*.png
            tests/results/**/*.txt

          retention-days: 1

  test-npm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build Vue Components
        run: |
          cd vue-components
          npm i
          npm run build

  release:
    needs: [pre-commit, pytest, test-npm-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/trame-vtklocal
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
      contents: write # IMPORTANT: mandatory for making GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build Vue Components
        run: |
          cd vue-components
          npm i
          npm run build

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.15.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package distributions to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
